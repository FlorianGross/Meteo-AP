<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ELW-Meteo Karte</title>

    <!--
        Leaflet is pulled from a CDN. The map tab needs a network connection for
        map tiles and radar imagery anyway, so there is nothing to gain from
        vendoring the library — but see README ("Offline-Betrieb") for how to
        bundle it if the vehicle has to work without internet.
    -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0e1116; }
        #map { position: absolute; inset: 0; background: #0e1116; }

        /* Dark, legible chrome to match the host application. */
        .leaflet-container { font-family: "Segoe UI", system-ui, sans-serif; background: #0e1116; }
        .leaflet-control-attribution {
            background: rgba(14, 17, 22, .82) !important;
            color: #93a1b1 !important;
            font-size: 10px;
        }
        .leaflet-control-attribution a { color: #6ea8fe !important; }
        .leaflet-control-scale-line {
            background: rgba(14, 17, 22, .82);
            border-color: #2c3542;
            color: #e6edf3;
        }
        .leaflet-bar a, .leaflet-bar a:hover {
            background: #171c24;
            color: #e6edf3;
            border-bottom-color: #2c3542;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #171c24;
            color: #e6edf3;
            box-shadow: 0 2px 12px rgba(0,0,0,.6);
        }

        /* Own position: a ring plus a rotating arrow showing where the air goes. */
        .elw-marker { position: relative; width: 44px; height: 44px; }
        .elw-marker .ring {
            position: absolute; left: 15px; top: 15px;
            width: 14px; height: 14px; border-radius: 50%;
            background: #3b82f6; border: 2px solid #e6edf3;
            box-shadow: 0 0 0 2px rgba(59,130,246,.35);
        }
        .elw-marker .arrow {
            position: absolute; inset: 0;
            transform-origin: 50% 50%;
        }
        .elw-marker .arrow svg { display: block; }

        .elw-banner {
            position: absolute; left: 10px; top: 10px; z-index: 600;
            background: rgba(23, 28, 36, .92);
            border: 1px solid #2c3542; border-radius: 5px;
            padding: 7px 11px; color: #e6edf3;
            font-size: 12px; line-height: 1.55; max-width: 290px;
            pointer-events: none;
        }
        .elw-banner b { color: #6ea8fe; }
        .elw-banner .muted { color: #93a1b1; }
        .elw-error {
            position: absolute; left: 10px; bottom: 26px; z-index: 600;
            background: rgba(230, 57, 70, .92); color: #fff;
            border-radius: 5px; padding: 6px 10px; font-size: 11px;
            display: none; max-width: 320px;
        }

        /* Scale for the wind colours, shown whenever a wind layer is on. */
        .elw-legend {
            position: absolute; right: 10px; bottom: 26px; z-index: 600;
            background: rgba(23, 28, 36, .92);
            border: 1px solid #2c3542; border-radius: 5px;
            padding: 7px 10px; color: #e6edf3; font-size: 11px;
            display: none;
        }
        .elw-legend .title { color: #93a1b1; margin-bottom: 5px; }
        .elw-legend .row { display: flex; align-items: center; gap: 7px; line-height: 1.7; }
        .elw-legend .swatch { width: 22px; height: 4px; border-radius: 2px; }

        /* Neutral note for zoom-dependent layers switching themselves off. */
        .elw-notice {
            position: absolute; left: 50%; transform: translateX(-50%);
            top: 10px; z-index: 600;
            background: rgba(23, 28, 36, .94);
            border: 1px solid #f59e0b; border-radius: 5px;
            padding: 6px 11px; color: #f59e0b; font-size: 11.5px;
            display: none; max-width: 420px; text-align: center;
        }
    </style>
</head>
<body>
<div id="map"></div>
<div class="elw-banner" id="banner"><span class="muted">Warte auf Daten …</span></div>
<div class="elw-error" id="error"></div>
<div class="elw-notice" id="notice"></div>
<div class="elw-legend" id="legend">
    <div class="title">WIND</div>
    <div class="row"><span class="swatch" style="background:#93a1b1"></span>&lt; 6 km/h</div>
    <div class="row"><span class="swatch" style="background:#38bdf8"></span>6–20 km/h · 2–3 Bft</div>
    <div class="row"><span class="swatch" style="background:#f59e0b"></span>20–39 km/h · 4–5 Bft</div>
    <div class="row"><span class="swatch" style="background:#f97316"></span>39–62 km/h · 6–7 Bft</div>
    <div class="row"><span class="swatch" style="background:#e63946"></span>&gt; 62 km/h · ab 8 Bft</div>
</div>

<script>
    "use strict";

    // ---------------------------------------------------------------- setup

    // Explicit zoom limits: without them the map inherits its range from whatever
    // layers happen to be on, which lets the user zoom past what a source serves.
    var map = L.map("map", {
        zoomControl: true,
        attributionControl: true,
        preferCanvas: true,
        minZoom: 3,
        maxZoom: 19
    }).setView([50.1109, 8.6821], 11);

    L.control.scale({ imperial: false, metric: true, position: "bottomleft" }).addTo(map);

    // Layer id -> Leaflet layer, so state pushes can add/remove incrementally.
    var layers = {};
    var baseLayerId = null;

    // Radar uses two slots so a frame change does not flash the base map.
    var radarSlots = [null, null];
    var radarSlot = 0;
    var radarUrl = null;
    var radarOpacity = 0.75;

    var satelliteLayer = null;
    var satelliteUrl = null;

    var windLayerGroup = null;
    // Retained so a zoom change can re-apply the zoom-dependent layers.
    var lastState = null;
    var hazardLayers = [];
    var positionMarker = null;
    var initialised = false;

    function showError(message) {
        var element = document.getElementById("error");
        if (!message) {
            element.style.display = "none";
            return;
        }
        element.textContent = message;
        element.style.display = "block";
    }

    /// Reports a failing source by name instead of leaving an error tile on screen.
    var failedLayers = {};

    function watchTileErrors(layer, title) {
        layer.on("tileerror", function () {
            if (failedLayers[title]) {
                return;
            }

            failedLayers[title] = true;
            showError("Kacheln nicht ladbar: " + title +
                " — Layer ausschalten oder Netzverbindung prüfen.");
            post({ type: "layerError", title: title });
        });

        layer.on("load", function () {
            if (failedLayers[title]) {
                delete failedLayers[title];
                if (Object.keys(failedLayers).length === 0) {
                    showError(null);
                }
            }
        });
    }

    function setNotice(message) {
        var element = document.getElementById("notice");
        if (!message) {
            element.style.display = "none";
            return;
        }
        element.textContent = message;
        element.style.display = "block";
    }

    function post(payload) {
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.postMessage(payload);
        }
    }

    // ------------------------------------------------------- layer handling

    function buildLayer(spec) {
        if (spec.wmsUrl) {
            return L.tileLayer.wms(spec.wmsUrl, {
                layers: spec.wmsLayers || "",
                format: spec.wmsFormat || "image/png",
                transparent: spec.wmsTransparent !== false,
                opacity: spec.opacity,
                attribution: spec.attribution,
                maxZoom: spec.maxZoom || 19,
                // DWD GeoServer serves EPSG:3857 for the web mercator layers.
                crs: L.CRS.EPSG3857,
                uppercase: true
            });
        }

        if (spec.tileUrl) {
            return L.tileLayer(spec.tileUrl, {
                opacity: spec.opacity,
                attribution: spec.attribution,
                // Keep zooming past the layer's native maximum by upscaling tiles,
                // so switching base maps never dumps the operator out of their view.
                maxZoom: 19,
                maxNativeZoom: spec.maxZoom || 19,
                crossOrigin: true
            });
        }

        return null;
    }

    // Layers switched off by their own zoom ceiling, reported to the operator.
    var zoomHidden = [];

    function applyLayers(specs) {
        var wanted = {};
        zoomHidden = [];

        // Base map below (z 100), overlays above it (z 300), radar on top (z 400).
        specs.forEach(function (spec) {
            wanted[spec.id] = true;

            var layer = layers[spec.id];

            // Radar and model products come off coarse grids. Past their ceiling
            // there is nothing left to resolve, and some servers answer with an
            // error graphic baked into the tile — which no tileerror handler can
            // catch, because it arrives as a perfectly valid image.
            var overZoom = typeof spec.maxUsefulZoom === "number" &&
                map.getZoom() > spec.maxUsefulZoom;

            if (!spec.enabled || overZoom) {
                if (layer && map.hasLayer(layer)) {
                    map.removeLayer(layer);
                }

                if (spec.enabled && overZoom) {
                    zoomHidden.push(spec.title);
                }

                return;
            }

            if (!layer) {
                layer = buildLayer(spec);
                if (!layer) {
                    return;
                }
                watchTileErrors(layer, spec.title);
                layers[spec.id] = layer;
            }

            if (!map.hasLayer(layer)) {
                layer.addTo(map);
            }

            if (spec.kind === "base") {
                layer.setZIndex(100);
                baseLayerId = spec.id;
            } else {
                layer.setZIndex(300);
            }
        });

        // Drop layers the host no longer mentions at all.
        Object.keys(layers).forEach(function (id) {
            if (!wanted[id] && map.hasLayer(layers[id])) {
                map.removeLayer(layers[id]);
            }
        });
    }

    // -------------------------------------------------------------- radar

    function applyRadar(url, opacity, maxZoom) {
        radarOpacity = typeof opacity === "number" ? opacity : radarOpacity;

        // Radar composites are about a kilometre per pixel. Past this zoom there
        // is nothing left to resolve, the upscaled tiles look like coloured mush
        // and some frames simply are not served — so drop the layer and say so
        // rather than leaving a broken or misleading picture on screen.
        var hidden = zoomHidden.slice();

        if (url && typeof maxZoom === "number" && map.getZoom() > maxZoom) {
            url = null;
            hidden.push("Regenradar");
        }

        if (hidden.length > 0) {
            setNotice(hidden.join(", ") + (hidden.length === 1 ? " ist" : " sind") +
                " für diese Zoomstufe ausgeblendet — die Daten geben diese Auflösung nicht her.");
        } else {
            setNotice(null);
        }

        if (!url) {
            radarSlots.forEach(function (slot) {
                if (slot && map.hasLayer(slot)) {
                    map.removeLayer(slot);
                }
            });
            radarSlots = [null, null];
            radarUrl = null;
            return;
        }

        if (url === radarUrl) {
            var current = radarSlots[radarSlot];
            if (current) {
                current.setOpacity(radarOpacity);
            }
            return;
        }

        radarUrl = url;

        var next = (radarSlot + 1) % 2;
        var previous = radarSlots[radarSlot];

        var layer = L.tileLayer(url, {
            opacity: 0,
            zIndex: 400,
            // Plain 256 px slippy tiles: no tileSize/zoomOffset compensation, so
            // there is no way for the requested tile coordinates to drift out of
            // the server's valid range. Above maxNativeZoom Leaflet upscales the
            // last real level instead of asking for one that does not exist.
            maxNativeZoom: 10,
            maxZoom: 19,
            attribution: 'Radar: <a href="https://www.rainviewer.com/">RainViewer</a>',
            crossOrigin: true
        });

        // Only reveal the new frame once its tiles are there, then drop the old one.
        layer.on("load", function () {
            layer.setOpacity(radarOpacity);
            if (previous && map.hasLayer(previous)) {
                map.removeLayer(previous);
            }
        });

        layer.addTo(map);

        if (radarSlots[next] && map.hasLayer(radarSlots[next])) {
            map.removeLayer(radarSlots[next]);
        }

        radarSlots[next] = layer;
        radarSlot = next;
    }

    // ---------------------------------------------------------- satellite

    function applySatellite(url, opacity) {
        if (!url) {
            if (satelliteLayer && map.hasLayer(satelliteLayer)) {
                map.removeLayer(satelliteLayer);
            }
            satelliteLayer = null;
            satelliteUrl = null;
            return;
        }

        if (url === satelliteUrl && satelliteLayer) {
            satelliteLayer.setOpacity(opacity);
            return;
        }

        var previous = satelliteLayer;
        satelliteUrl = url;

        satelliteLayer = L.tileLayer(url, {
            opacity: opacity,
            // Sits between the base map and the overlays: clouds behind warnings.
            zIndex: 200,
            maxNativeZoom: 8,
            maxZoom: 19,
            attribution: 'Satellit: <a href="https://www.rainviewer.com/">RainViewer</a>',
            crossOrigin: true
        });

        satelliteLayer.on("load", function () {
            if (previous && map.hasLayer(previous)) {
                map.removeLayer(previous);
            }
        });

        satelliteLayer.addTo(map);
    }

    // --------------------------------------------------------- wind field

    // Arrow length and colour both grow with wind speed, so the pattern of the
    // flow reads at a glance without having to look at the numbers.
    function windColour(speedMs) {
        if (speedMs >= 17.2) { return "#e63946"; }   // 8 Bft and up
        if (speedMs >= 10.8) { return "#f97316"; }   // 6 Bft
        if (speedMs >= 5.5) { return "#f59e0b"; }    // 4 Bft
        if (speedMs >= 1.6) { return "#38bdf8"; }
        return "#93a1b1";
    }

    function windGridIcon(arrow) {
        var length = Math.min(30, 11 + arrow.speedMs * 1.6);
        var colour = windColour(arrow.speedMs);

        var svg =
            '<svg width="46" height="46" viewBox="-23 -23 46 46">' +
            '<line x1="0" y1="' + (length / 2) + '" x2="0" y2="' + (-length / 2 + 5) + '" ' +
            'stroke="' + colour + '" stroke-width="2.5" stroke-linecap="round"/>' +
            '<path d="M 0,' + (-length / 2) + ' L 5.5,' + (-length / 2 + 8) +
            ' L -5.5,' + (-length / 2 + 8) + ' Z" fill="' + colour + '"/>' +
            "</svg>";

        return L.divIcon({
            className: "",
            iconSize: [46, 46],
            iconAnchor: [23, 23],
            html: '<div style="transform: rotate(' + arrow.downwindDeg + 'deg)">' + svg + "</div>"
        });
    }

    // ------------------------------------------- animated wind (Windy style)

    // A canvas of particles advected by the interpolated wind grid. Trails are
    // produced by fading the previous frame rather than clearing it, which is
    // what gives the streaklines their length.
    var WindAnimationLayer = L.Layer.extend({
        initialize: function (grid, options) {
            this._grid = grid;
            this._particles = [];
            this._frame = null;
            L.setOptions(this, options || {});
        },

        options: {
            particleCount: 2200,
            // Metres travelled per animation frame, per m/s of wind.
            speedFactor: 14,
            // Frames before a particle is reseeded, so the field keeps refreshing.
            maxAge: 90,
            trailOpacity: 0.92,
            // Zoom at and below which the full particle count is drawn. Zooming
            // in shrinks the covered area, so the same count would crowd it.
            referenceZoom: 11,
            // Never move a particle further than this per frame. Strict metres-
            // per-pixel scaling is physically right but reads as a blur close in,
            // because the covered ground shrinks faster than the eye expects.
            maxPixelStep: 3.5
        },

        onAdd: function (map) {
            this._map = map;
            this._canvas = L.DomUtil.create("canvas", "leaflet-zoom-animated");
            this._canvas.style.pointerEvents = "none";
            this._canvas.style.zIndex = 350;
            map.getPanes().overlayPane.appendChild(this._canvas);

            map.on("moveend", this._reset, this);
            map.on("zoomstart movestart", this._pause, this);
            map.on("resize", this._reset, this);

            this._reset();
            return this;
        },

        onRemove: function (map) {
            this._pause();
            map.off("moveend", this._reset, this);
            map.off("zoomstart movestart", this._pause, this);
            map.off("resize", this._reset, this);

            if (this._canvas && this._canvas.parentNode) {
                this._canvas.parentNode.removeChild(this._canvas);
            }
            this._canvas = null;
            return this;
        },

        setGrid: function (grid) {
            this._grid = grid;
            this._seedAll();
        },

        _pause: function () {
            if (this._frame) {
                L.Util.cancelAnimFrame(this._frame);
                this._frame = null;
            }
        },

        _reset: function () {
            if (!this._canvas || !this._map) {
                return;
            }

            var size = this._map.getSize();
            var topLeft = this._map.containerPointToLayerPoint([0, 0]);

            L.DomUtil.setPosition(this._canvas, topLeft);
            this._canvas.width = size.x;
            this._canvas.height = size.y;
            this._context = this._canvas.getContext("2d");

            this._seedAll();
            this._pause();
            this._frame = L.Util.requestAnimFrame(this._step, this);
        },

        // Halve the particles for every zoom step past the reference, so the
        // streaks stay separable instead of merging into a solid wash.
        _targetCount: function () {
            var over = Math.max(0, this._map.getZoom() - this.options.referenceZoom);
            var scaled = this.options.particleCount / Math.pow(2, over);
            return Math.max(150, Math.round(scaled));
        },

        _seedAll: function () {
            this._particles = [];
            if (!this._map) {
                return;
            }

            var count = this._targetCount();
            for (var i = 0; i < count; i++) {
                this._particles.push(this._seed(Math.floor(Math.random() * this.options.maxAge)));
            }
        },

        _seed: function (age) {
            var size = this._map.getSize();
            return {
                x: Math.random() * size.x,
                y: Math.random() * size.y,
                age: age || 0
            };
        },

        // Bilinear sample of the grid, mirroring WindGrid.Sample on the C# side.
        _sample: function (lat, lon) {
            var g = this._grid;
            var rowSpan = g.north - g.south;
            var columnSpan = g.east - g.west;

            var row = rowSpan <= 0 ? 0 : (g.north - lat) / rowSpan * (g.size - 1);
            var column = columnSpan <= 0 ? 0 : (lon - g.west) / columnSpan * (g.size - 1);

            row = Math.max(0, Math.min(g.size - 1, row));
            column = Math.max(0, Math.min(g.size - 1, column));

            var r0 = Math.floor(row), c0 = Math.floor(column);
            var r1 = Math.min(r0 + 1, g.size - 1), c1 = Math.min(c0 + 1, g.size - 1);
            var fr = row - r0, fc = column - c0;

            function at(r, c, arr) { return arr[r * g.size + c]; }
            function blend(arr) {
                var top = at(r0, c0, arr) + (at(r0, c1, arr) - at(r0, c0, arr)) * fc;
                var bottom = at(r1, c0, arr) + (at(r1, c1, arr) - at(r1, c0, arr)) * fc;
                return top + (bottom - top) * fr;
            }

            return { u: blend(g.u), v: blend(g.v) };
        },

        _step: function () {
            if (!this._context || !this._map || !this._grid) {
                return;
            }

            var context = this._context;
            var size = this._map.getSize();

            // Fade instead of clear: this is what leaves the trails behind.
            context.globalCompositeOperation = "destination-in";
            context.fillStyle = "rgba(0, 0, 0, " + this.options.trailOpacity + ")";
            context.fillRect(0, 0, size.x, size.y);
            context.globalCompositeOperation = "source-over";

            context.lineWidth = 1.4;
            context.lineCap = "round";

            // Metres per pixel at this latitude and zoom, so the drawn speed
            // matches the real wind however far the map is zoomed in.
            var centre = this._map.getCenter();
            var metresPerPixel = 40075016.686 * Math.abs(Math.cos(centre.lat * Math.PI / 180)) /
                Math.pow(2, this._map.getZoom() + 8);

            for (var i = 0; i < this._particles.length; i++) {
                var particle = this._particles[i];

                if (particle.age > this.options.maxAge) {
                    this._particles[i] = this._seed(0);
                    continue;
                }

                var latlng = this._map.containerPointToLatLng([particle.x, particle.y]);
                var wind = this._sample(latlng.lat, latlng.lng);
                var speed = Math.sqrt(wind.u * wind.u + wind.v * wind.v);

                // Screen y grows downwards, so the northward component is negated.
                var dx = wind.u * this.options.speedFactor / metresPerPixel;
                var dy = -wind.v * this.options.speedFactor / metresPerPixel;

                // Cap the step so close-in zooms stay watchable; the colour, not
                // the on-screen pace, remains the quantitative cue for speed.
                var step = Math.sqrt(dx * dx + dy * dy);
                if (step > this.options.maxPixelStep) {
                    var scale = this.options.maxPixelStep / step;
                    dx *= scale;
                    dy *= scale;
                }

                var nextX = particle.x + dx;
                var nextY = particle.y + dy;

                if (nextX < 0 || nextX > size.x || nextY < 0 || nextY > size.y) {
                    this._particles[i] = this._seed(0);
                    continue;
                }

                context.strokeStyle = windColour(speed);
                context.beginPath();
                context.moveTo(particle.x, particle.y);
                context.lineTo(nextX, nextY);
                context.stroke();

                particle.x = nextX;
                particle.y = nextY;
                particle.age += 1;
            }

            this._frame = L.Util.requestAnimFrame(this._step, this);
        }
    });

    var windAnimation = null;

    function applyWindAnimation(grid, maxZoom) {
        // The grid nodes are kilometres apart. Zoomed in far enough the whole
        // view sits inside one cell, so every particle carries the same vector
        // and the animation only pretends to say something.
        if (grid && typeof maxZoom === "number" && map.getZoom() > maxZoom) {
            grid = null;
        }

        if (!grid || !grid.u || grid.size < 2) {
            if (windAnimation) {
                map.removeLayer(windAnimation);
                windAnimation = null;
            }
            return;
        }

        if (!windAnimation) {
            windAnimation = new WindAnimationLayer(grid);
            windAnimation.addTo(map);
        } else {
            windAnimation.setGrid(grid);
        }
    }

    function applyWindField(arrows) {
        if (windLayerGroup) {
            map.removeLayer(windLayerGroup);
            windLayerGroup = null;
        }

        if (!arrows || arrows.length === 0) {
            return;
        }

        var markers = arrows.map(function (arrow) {
            var marker = L.marker([arrow.latitude, arrow.longitude], {
                icon: windGridIcon(arrow),
                interactive: true,
                keyboard: false
            });

            var text = "Wind aus <b>" + arrow.fromCompass + "</b><br>" +
                Math.round(arrow.speedKmh) + " km/h";

            if (typeof arrow.gustKmh === "number") {
                text += "<br>Böen " + Math.round(arrow.gustKmh) + " km/h";
            }

            marker.bindTooltip(text, { direction: "top", opacity: 0.95 });
            return marker;
        });

        windLayerGroup = L.layerGroup(markers).addTo(map);
    }

    // ------------------------------------------------------------- markers

    function windArrowIcon(bearingDeg) {
        // An arrow pointing downwind; SVG points up at 0° and is rotated from there.
        var svg =
            '<svg width="44" height="44" viewBox="0 0 44 44">' +
            '<path d="M22 1 L27 13 L23 13 L23 20 L21 20 L21 13 L17 13 Z" ' +
            'fill="#f59e0b" stroke="#0e1116" stroke-width="1"/></svg>';

        return L.divIcon({
            className: "",
            iconSize: [44, 44],
            iconAnchor: [22, 22],
            html:
                '<div class="elw-marker">' +
                '<div class="arrow" style="transform: rotate(' + bearingDeg + 'deg)">' + svg + '</div>' +
                '<div class="ring"></div>' +
                '</div>'
        });
    }

    function applyMarker(marker) {
        if (!marker) {
            return;
        }

        var latlng = [marker.latitude, marker.longitude];
        var icon = windArrowIcon(marker.downwindBearingDeg || 0);

        if (!positionMarker) {
            positionMarker = L.marker(latlng, { icon: icon, zIndexOffset: 1000 }).addTo(map);
        } else {
            positionMarker.setLatLng(latlng);
            positionMarker.setIcon(icon);
        }

        var lines = [];
        lines.push("<b>Eigener Standort</b>");
        lines.push('<span class="muted">' + marker.sourceLabel + "</span>");

        if (typeof marker.temperatureC === "number") {
            lines.push(marker.temperatureC.toFixed(1).replace(".", ",") + " °C");
        }

        if (typeof marker.windSpeedMs === "number") {
            lines.push(
                "Wind aus " + marker.windFromCompass + ", " +
                (marker.windSpeedMs * 3.6).toFixed(0) + " km/h");
        }

        positionMarker.bindPopup(lines.join("<br>"));
    }

    // -------------------------------------------------------------- hazard

    function clearHazard() {
        hazardLayers.forEach(function (layer) {
            if (map.hasLayer(layer)) {
                map.removeLayer(layer);
            }
        });
        hazardLayers = [];
    }

    function applyHazard(hazard) {
        clearHazard();

        if (!hazard) {
            return;
        }

        var cone = L.polygon(hazard.cone, {
            color: "#f59e0b",
            weight: 2,
            opacity: 0.9,
            fillColor: "#f59e0b",
            fillOpacity: 0.16,
            interactive: false
        }).addTo(map);

        var centre = L.polyline(hazard.centreLine, {
            color: "#f59e0b",
            weight: 2,
            opacity: 0.75,
            dashArray: "7 6",
            interactive: false
        }).addTo(map);

        hazardLayers.push(cone, centre);

        if (hazard.innerRadiusMetres > 0 && hazard.cone.length > 0) {
            var inner = L.circle(hazard.cone[0], {
                radius: hazard.innerRadiusMetres,
                color: "#e63946",
                weight: 2,
                fillColor: "#e63946",
                fillOpacity: 0.12,
                interactive: false
            }).addTo(map);
            hazardLayers.push(inner);
        }
    }

    // -------------------------------------------------------------- banner

    function updateBanner(state) {
        var parts = [];

        if (state.marker) {
            parts.push(
                "<b>" + state.marker.latitude.toFixed(5).replace(".", ",") +
                " / " + state.marker.longitude.toFixed(5).replace(".", ",") + "</b>");
            parts.push('<span class="muted">' + state.marker.sourceLabel + "</span>");
        }

        if (state.hazard) {
            parts.push(
                "Ausbreitung nach <b>" + state.hazard.downwindCompass + "</b>, " +
                "Klasse " + state.hazard.stabilityClass);
            parts.push(
                '<span class="muted">Kegel ' + Math.round(state.hazard.rangeMetres) +
                " m, Innenkreis " + Math.round(state.hazard.innerRadiusMetres) + " m</span>");
        }

        if (parts.length === 0) {
            parts.push('<span class="muted">Warte auf Daten …</span>');
        }

        document.getElementById("banner").innerHTML = parts.join("<br>");
    }

    // ----------------------------------------------------------- host API

    window.elwMeteo = {
        apply: function (json) {
            try {
                var state = typeof json === "string" ? JSON.parse(json) : json;

                lastState = state;
                applyLayers(state.layers || []);
                applySatellite(state.satelliteTileUrl, state.satelliteOpacity);
                applyRadar(state.radarTileUrl, state.radarOpacity, state.radarMaxZoom);
                applyWindField(state.windArrows);
                applyWindAnimation(state.windGrid, state.windAnimationMaxZoom);

                // The colour scale is only meaningful while a wind layer is on.
                var windVisible = (state.windArrows && state.windArrows.length > 0) ||
                    (state.windGrid && state.windGrid.size >= 2);
                document.getElementById("legend").style.display = windVisible ? "block" : "none";
                applyMarker(state.marker);
                applyHazard(state.hazard);
                updateBanner(state);

                if (state.marker && (state.recentre || !initialised)) {
                    var zoom = initialised ? map.getZoom() : (state.zoom || 11);
                    map.setView([state.marker.latitude, state.marker.longitude], zoom);
                    initialised = true;
                }

                showError(null);
            } catch (e) {
                showError("Kartenzustand konnte nicht angewendet werden: " + e.message);
            }
        }
    };

    map.on("click", function (event) {
        post({
            type: "mapClick",
            lat: event.latlng.lat,
            lon: event.latlng.lng
        });
    });

    map.on("zoomend", function () {
        post({ type: "zoomChanged", zoom: map.getZoom() });

        // Radar and wind animation are gated on zoom, so both have to be
        // re-evaluated whenever it changes — not only when the host pushes state.
        if (lastState) {
            // applyLayers recomputes zoomHidden, which applyRadar folds into the notice.
            applyLayers(lastState.layers || []);
            applyRadar(lastState.radarTileUrl, lastState.radarOpacity, lastState.radarMaxZoom);
            applyWindAnimation(lastState.windGrid, lastState.windAnimationMaxZoom);
        }
    });

    // Tell the host we are ready to receive state.
    post({ type: "ready" });
</script>
</body>
</html>
