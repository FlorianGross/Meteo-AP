name: Release

# Cutting a release: tag a commit and push the tag.
#   git tag -a v1.1.0 -m "ELW-Meteo 1.1.0" && git push origin v1.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version für einen manuellen Lauf, z. B. 1.1.0"
        required: true
        type: string

permissions:
  contents: write        # needed to create the release

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Windows-Paket bauen und veröffentlichen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # A tag gives "refs/tags/v1.1.0"; a manual run supplies the bare number.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Version: ${version}"

      - name: Restore
        run: dotnet restore ELW-Meteo.sln

      - name: Test
        run: dotnet test tests/ElwMeteo.Core.Tests/ElwMeteo.Core.Tests.csproj -c Release

      # Two flavours: the small one for machines that already have .NET 8, and a
      # self-contained build for vehicle laptops where installing a runtime is
      # more trouble than copying a folder.
      - name: Publish (framework-dependent)
        run: >
          dotnet publish src/ElwMeteo.App -c Release -r win-x64
          --self-contained false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/framework-dependent

      - name: Publish (self-contained)
        run: >
          dotnet publish src/ElwMeteo.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/self-contained

      # The cross-platform head, one package per system. Self-contained
      # throughout: on a vehicle laptop, installing a runtime first is exactly
      # the step that does not happen.
      - name: Publish (Linux und macOS)
        shell: bash
        run: |
          for rid in linux-x64 osx-x64 osx-arm64; do
            dotnet publish src/ElwMeteo.Desktop -c Release -r "$rid" \
              --self-contained true \
              -p:Version=${{ steps.version.outputs.version }} \
              -o "publish/$rid"
          done

      # The installer is built from the self-contained publish: a package that
      # installs cleanly and then refuses to start because the machine has no
      # .NET runtime is the worst of both worlds, and a fleet rollout is exactly
      # where nobody is standing at the screen to see why.
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build installer
        run: >
          pwsh installer/build-installer.ps1
          -PublishDirectory publish/self-contained
          -Version ${{ steps.version.outputs.version }}
          -OutputPath ELW-Meteo-${{ steps.version.outputs.version }}-win-x64.msi

      - name: Test installer
        run: pwsh installer/test-installer.ps1 -MsiPath ELW-Meteo-${{ steps.version.outputs.version }}-win-x64.msi

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath "ELW-Meteo-$v-win-x64.zip"
          Compress-Archive -Path publish/self-contained/*      -DestinationPath "ELW-Meteo-$v-win-x64-standalone.zip"
          Compress-Archive -Path publish/linux-x64/*           -DestinationPath "ELW-Meteo-$v-linux-x64.zip"
          Compress-Archive -Path publish/osx-x64/*             -DestinationPath "ELW-Meteo-$v-macos-x64.zip"
          Compress-Archive -Path publish/osx-arm64/*           -DestinationPath "ELW-Meteo-$v-macos-arm64.zip"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ELW-Meteo ${{ steps.version.outputs.version }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.version) || github.ref_name }}
          generate_release_notes: true
          files: |
            ELW-Meteo-*.zip
            ELW-Meteo-*.msi
          body: |
            ## Installation

            **`ELW-Meteo-${{ steps.version.outputs.version }}-win-x64.msi`** — der übliche Weg
            Doppelklick genügt. Installiert ohne Administratorrechte für den
            angemeldeten Benutzer, legt Start- und Desktop-Verknüpfung an und
            erscheint in „Programme und Features". Bringt die Runtime mit.

            Für die Verteilung auf mehrere Fahrzeugrechner:

            ```
            msiexec /i ELW-Meteo-${{ steps.version.outputs.version }}-win-x64.msi ALLUSERS=1 /qn
            ```

            Das installiert nach `C:\Programme\ELW-Meteo` für alle Benutzer und
            braucht Administratorrechte. **Achtung:** dort kann die
            Selbst-Aktualisierung nicht schreiben — sie meldet das und verweigert
            den Austausch. Aktualisiert wird eine solche Installation über ein
            neues MSI. Bei der Installation pro Benutzer funktioniert die
            Selbst-Aktualisierung wie gewohnt.

            `INSTALLDESKTOPSHORTCUT=0` lässt die Desktop-Verknüpfung weg.
            Einstellungen, Protokolle und Berichte unter
            `%APPDATA%\ELW-Meteo` bleiben beim Deinstallieren erhalten.

            **`ELW-Meteo-${{ steps.version.outputs.version }}-win-x64.zip`**
            Benötigt die .NET-8-Desktop-Runtime auf dem Rechner. Entpacken und
            `ELW-Meteo.exe` starten.

            **`ELW-Meteo-${{ steps.version.outputs.version }}-win-x64-standalone.zip`**
            Bringt die Runtime mit — für Fahrzeugrechner ohne installiertes .NET.
            Entpacken und `ELW-Meteo.exe` starten, sonst nichts.

            **`…-linux-x64.zip`, `…-macos-x64.zip`, `…-macos-arm64.zip`**
            Die plattformneutrale Ausgabe für Linux und macOS, jeweils mit
            Runtime. Entpacken, `chmod +x ELW-Meteo`, starten. macOS-arm64 ist
            für Apple Silicon, macOS-x64 für Intel-Macs.

            Uhr, Lage, Verlauf, Diagnose und Einstellungen sind auf allen drei
            Systemen gleich. Auf Linux und macOS öffnen Karte und Web-Radar im
            Standardbrowser statt in einem eingebetteten Fenster — die dafür
            nötige Komponente gibt es dort nicht plattformübergreifend.

            Für die Kartenregisterkarte wird zusätzlich die Microsoft Edge
            **WebView2-Runtime** benötigt. Auf aktuellen Windows-Installationen
            ist sie bereits vorhanden; fehlt sie, bleibt nur diese Registerkarte
            leer und zeigt einen Hinweis.
