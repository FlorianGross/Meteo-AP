name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The WPF project only *runs* on Windows, so that is where the real build lives.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ELW-Meteo.sln

      - name: Build
        run: dotnet build ELW-Meteo.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/ElwMeteo.Core.Tests/ElwMeteo.Core.Tests.csproj -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/ElwMeteo.App -c Release -r win-x64 --self-contained false -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: ELW-Meteo-win-x64
          path: publish/

  # Guards the rule that all domain logic stays free of WPF dependencies.
  core-crossplatform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test domain logic
        run: dotnet test tests/ElwMeteo.Core.Tests/ElwMeteo.Core.Tests.csproj -c Release
