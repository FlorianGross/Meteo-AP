name: Build & Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]      # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # The WPF project only *runs* on Windows, so that is where the real build lives.
  build:
    name: Windows build, test and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore ELW-Meteo.sln

      - name: Build
        run: dotnet build ELW-Meteo.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test tests/ElwMeteo.Core.Tests/ElwMeteo.Core.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Publish
        run: >
          dotnet publish src/ElwMeteo.App -c Release -r win-x64
          --self-contained false -o publish

      - name: Upload application
        uses: actions/upload-artifact@v7
        with:
          name: ELW-Meteo-win-x64
          path: publish/
          retention-days: 30

  # The cross-platform head, built and smoke-tested on all three systems it
  # claims to support. Nothing here may reference WPF: if this job fails on
  # Linux or macOS, something Windows-specific has leaked into Core,
  # Presentation or Desktop.
  crossplatform:
    name: Plattformneutral (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Test domain logic
        run: dotnet test tests/ElwMeteo.Core.Tests/ElwMeteo.Core.Tests.csproj -c Release

      # Builds the Avalonia head and constructs every view for real on a
      # headless platform. The XAML compiler catches a misspelt element; only
      # this catches a missing resource or a broken template.
      - name: Test cross-platform interface
        run: dotnet test tests/ElwMeteo.Desktop.Tests/ElwMeteo.Desktop.Tests.csproj -c Release

      - name: Publish cross-platform head
        run: dotnet publish src/ElwMeteo.Desktop -c Release -o publish-desktop

  # Formatting is advisory: a style nit must never block a fix from reaching a vehicle.
  format:
    name: Codeformatierung
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      # One project per invocation: dotnet format takes a single project or
      # solution, and passing two paths makes it abort with a usage error rather
      # than a formatting complaint.
      - name: Verify formatting (Fachlogik)
        run: dotnet format src/ElwMeteo.Core/ElwMeteo.Core.csproj --verify-no-changes --severity warn

      - name: Verify formatting (Tests)
        run: dotnet format tests/ElwMeteo.Core.Tests/ElwMeteo.Core.Tests.csproj --verify-no-changes --severity warn

      - name: Verify formatting (Ansichtsmodelle)
        run: dotnet format src/ElwMeteo.Presentation/ElwMeteo.Presentation.csproj --verify-no-changes --severity warn
